<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0A0F1C;background-image:radial-gradient(900px 500px at 20% -10%,#1a2a5255,transparent),radial-gradient(700px 400px at 90% 120%,#0f3a3a55,transparent);color:#E8EEF8;font-family:Onest,sans-serif;display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:0 70px;box-sizing:border-box}
.eb{font-family:"JetBrains Mono",monospace;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#97A3BF}
h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:118px;line-height:1;margin:14px 0 0;letter-spacing:-.02em}
h1 span{color:#2FC58A}
.sub{font-family:Unbounded,sans-serif;font-weight:500;font-size:31px;line-height:1.25;margin-top:20px}
.rs{display:flex;gap:10px;margin-top:28px}
.r{font-size:19px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid #33426A;background:#131C31}
.card{background:#131C31;border:1px solid #33426A;border-radius:24px;padding:26px;display:grid;gap:16px;box-shadow:0 30px 60px -30px #000;transform:rotate(-2.5deg)}
.ag{display:flex;gap:14px;align-items:center;font-size:20px;font-weight:700}
.av{width:50px;height:50px;border-radius:14px;background:rgba(91,141,255,.16);display:grid;place-items:center;color:#5B8DFF}
.act{font-size:27px;font-weight:600;line-height:1.25}
.n{font-size:18px;color:#97A3BF}
.v{font-size:17px;font-weight:600;color:#A78BFA;background:rgba(167,139,250,.14);border-radius:12px;padding:10px 12px}
.b{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b div{text-align:center;font-size:21px;font-weight:700;padding:14px;border-radius:16px}
.bl{color:#FF5A60;border:1.5px solid #FF5A60;background:rgba(255,90,96,.14)}
.al{color:#2FC58A;border:1.5px solid #2FC58A;background:rgba(47,197,138,.14)}
</style></head><body>
<div><div class="eb">Игра · 3 минуты</div><h1>Agent <span>SOC</span></h1><div class="sub">Побудь службой безопасности для 10 000 AI-агентов</div>
<div class="rs"><span class="r" style="color:#F5B547">1 · Вручную</span><span class="r" style="color:#A78BFA">2 · С ИИ</span><span class="r" style="color:#5B8DFF">3 · С архитектурой</span></div></div>
<div class="card"><div class="ag"><span class="av"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg></span>Агент поддержки</div>
<div class="act">Перевести 9 800 € на новый счёт</div><div class="n">Перед этим: прочитал вложение от клиента</div><div class="v">✦ ИИ-надзиратель: безопасно · 96%</div>
<div class="b"><div class="bl">✕ Блок</div><div class="al">✓ Разрешить</div></div></div>
</body></html>
