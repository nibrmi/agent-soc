<style>
/* One visual world on purpose: a night-shift security console. A single centred column (max 600px)
   that fills the phone screen; decisions sit in the thumb zone at the bottom. */
:root{
  --bg:#0A0F1C; --bg2:#0E1526; --panel:#131C31; --panel2:#19243E; --line:#26324F; --line2:#33426A;
  --ink:#E8EEF8; --muted:#97A3BF; --dim:#66728F;
  --allow:#2FC58A; --block:#FF5A60; --warn:#F5B547; --ai:#A78BFA; --rule:#5B8DFF; --human:#F59E6B;
  --allow-s:rgba(47,197,138,.14); --block-s:rgba(255,90,96,.14); --warn-s:rgba(245,181,71,.14); --ai-s:rgba(167,139,250,.14); --rule-s:rgba(91,141,255,.14);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 600px at 50% -10%,#16224233,transparent),radial-gradient(800px 400px at 50% 110%,#0f2a3a44,transparent);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--rule)}
:focus-visible{outline:3px solid var(--rule);outline-offset:2px;border-radius:8px}
#app{min-height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.mono{font-family:var(--f-mono)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}

/* ---------- static screens ---------- */
.screen{display:flex;flex-direction:column;gap:18px;padding-block:22px 28px;flex:1}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.lang{font-size:13px;font-weight:700;color:var(--rule);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:4px 10px;letter-spacing:.05em}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(44px,13vw,68px);letter-spacing:-.02em}
.hero h1 span{color:var(--allow)}
.lead{font-size:18px;color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:14px}
.rounds{display:grid;gap:8px}
.rnd{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rnd .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
.rnd b{display:block;font-size:15px}
.rnd span{font-size:13.5px;color:var(--muted)}
.howto{display:flex;gap:10px;flex-wrap:wrap}
.key{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.key i{font-style:normal;font-weight:700}
.calm{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.calm input{width:20px;height:20px;accent-color:var(--rule)}
.cta{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:14px;padding:15px 18px;font-weight:700;font-size:16px;text-align:center;text-decoration:none;color:var(--ink);display:inline-flex;justify-content:center;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--rule);border-color:var(--rule);color:#fff}
.btn.allow{background:var(--allow);border-color:var(--allow);color:#06251A}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.35;cursor:default}
.note{font-size:13px;color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}

/* ---------- play screen ---------- */
.play{display:flex;flex-direction:column;flex:1;min-height:0;padding-block:10px 12px;gap:10px;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:900px;margin-block:auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rchip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);white-space:nowrap}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{font-family:var(--f-mono);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{font-weight:600}
.queue{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:10px}
.queue .mono{color:var(--ink);font-variant-numeric:tabular-nums}
.queue .rate{color:var(--warn)}
.ticker{display:grid;gap:5px;max-height:132px;overflow:hidden}
.tk{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;animation:tkin .35s both}
.tk .d{width:8px;height:8px;border-radius:50%}
.tk .x{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tk .v{font-family:var(--f-mono);font-size:11px;font-weight:600;white-space:nowrap}
.tk.hl{border-color:var(--warn);background:var(--warn-s)}
.tk.hl .x{color:var(--ink)}
@keyframes tkin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;margin-inline:-6px;padding-inline:6px}
.stage>.card{margin-block:auto}
.card{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:18px;display:grid;gap:12px;box-shadow:0 24px 48px -28px #000;touch-action:pan-y;user-select:none;will-change:transform;animation:cardin .28s backwards}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card.fly-l{transition:transform .35s ease-in,opacity .35s;transform:translateX(-120%) rotate(-14deg)!important;opacity:0}
.card.fly-r{transition:transform .35s ease-in,opacity .35s;transform:translateX(120%) rotate(14deg)!important;opacity:0}
.agent{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--rule-s);color:var(--rule)}
.agent b{display:block;font-size:15.5px}
.agent .mono{font-size:12px;color:var(--dim)}
.act{font-size:19px;font-weight:600;line-height:1.3}
.facts{display:grid;gap:7px}
.fact{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14.5px;color:var(--muted);align-items:start}
.fact svg{margin-top:2px;color:var(--dim)}
.fact.alert{color:var(--warn)}
.fact.alert svg{color:var(--warn)}
.verdict{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 10px;border-radius:10px}
.verdict.ai{background:var(--ai-s);color:var(--ai)}
.verdict.human{background:var(--warn-s);color:var(--warn)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.chk.ok{background:var(--allow-s);color:var(--allow)}
.chk.no{background:var(--block-s);color:var(--block)}
.chk.na{background:var(--bg2);color:var(--dim);border:1px solid var(--line)}
.hint{position:absolute;top:16px;font-family:var(--f-display);font-weight:700;font-size:16px;padding:6px 12px;border-radius:10px;border:2.5px solid;opacity:0;pointer-events:none;letter-spacing:.04em}
.hint.l{right:16px;color:var(--block);border-color:var(--block);transform:rotate(10deg)}
.hint.r{left:16px;color:var(--allow);border-color:var(--allow);transform:rotate(-10deg)}
.timer{height:6px;border-radius:999px;background:var(--panel);overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:var(--warn);transform-origin:left}
.timer.calm i{background:var(--line2)}
.fb{position:absolute;inset:auto 0 0 0;background:var(--panel2);border:1px solid var(--line2);border-radius:18px;padding:14px 16px;display:grid;gap:6px;animation:fbin .25s both;box-shadow:0 -10px 40px -10px #000}
@keyframes fbin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fb b{font-size:16px;display:flex;gap:8px;align-items:center}
.fb p{margin:0;font-size:14.5px;color:var(--muted)}
.fb.good{border-color:var(--allow)} .fb.good b{color:var(--allow)}
.fb.bad{border-color:var(--block)} .fb.bad b{color:var(--block)}
.fb.warn{border-color:var(--warn)} .fb.warn b{color:var(--warn)}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.decide .btn{padding:17px 10px;font-size:17px;border-radius:16px}
.decide .b-block{background:var(--block-s);border-color:var(--block);color:var(--block)}
.decide .b-allow{background:var(--allow-s);border-color:var(--allow);color:var(--allow)}
.decide .b-next{grid-column:1/-1}

/* ---------- results ---------- */
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,14vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.42em;color:var(--muted);font-weight:500}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.num{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.num b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.num span{font-size:13px;color:var(--muted)}
.lesson{border-left:3px solid var(--rule);padding:4px 0 4px 14px;font-size:16px}
.reveal{background:var(--warn-s);border:1px solid var(--warn);border-radius:16px;padding:16px;display:grid;gap:10px}
.reveal .q{font-family:var(--f-mono);font-size:13px;background:var(--bg2);border-radius:10px;padding:10px;color:var(--ink);border:1px dashed var(--warn)}
mark{background:var(--warn-s);color:var(--warn);border-radius:4px;padding:0 3px}
.tools{display:grid;gap:10px}
.tool{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;transition:border-color .2s,background .2s}
.tool .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--bg2);color:var(--dim);transition:all .2s}
.tool b{display:block;font-size:15.5px}
.tool span{display:block;font-size:13.5px;color:var(--muted)}
.tool .sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tool .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tool[aria-pressed="true"]{border-color:var(--rule);background:var(--rule-s)}
.tool[aria-pressed="true"] .ic{background:var(--rule);color:#fff}
.tool[aria-pressed="true"] .sw{background:var(--rule)}
.tool[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.bars{display:grid;gap:12px}
.bar{display:grid;gap:6px}
.bar .top{display:flex;justify-content:space-between;font-size:14px}
.bar .top b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar .tr{height:12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:999px;transition:width .8s ease}
.bar .sub{font-size:12.5px;color:var(--dim)}
.markets{display:grid;gap:10px}
.mk{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px}
.mk .h{display:flex;gap:10px;align-items:center}
.mk .h .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--rule-s);color:var(--rule);flex:none}
.mk b{font-size:15.5px}
.mk p{margin:0;font-size:14px;color:var(--muted)}
.mk .who{font-size:13px;color:var(--ink)}
.share{display:grid;gap:10px}
.share textarea{width:100%;min-height:96px;resize:vertical;background:var(--bg2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:12px;font:inherit;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.links{display:grid;gap:6px;font-size:14px;padding-left:18px;margin:0}
.thesis{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.35}
.sec{display:grid;gap:12px}
.sec h3{font-size:16px}
@media (max-height:740px){.ticker{max-height:66px}.act{font-size:17px}.card{gap:9px;padding:15px}.decide .btn{padding:14px 10px}}
.screen .cta.stick{position:sticky;bottom:0;padding-block:16px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 26%)}
@media (hover:hover) and (pointer:fine){.only-touch{display:none}}
@media (hover:none),(pointer:coarse){.only-mouse{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

/* ---------- icons ---------- */
const P = {

const ic = (k, s=22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]||""}</svg>`;

/* ---------- strings ---------- */
const S = {
  brand:"Agent SOC",
  langLabel:{ru:"EN", en:"RU"},
  langTitle:{ru:"English version", en:"Русская версия"},

/* ---------- state ---------- */
const st = {calm:false, round:0, idx:0, busy:false, res:null, timers:[], t0:0, tick:0, counter:0, feed:[]};
const fresh = () => [0,1,2].map(() => ({caught:0, missed:0, fp:0, ok:0, late:0, auto:0}));
function later(fn, ms){ const id = setTimeout(fn, ms * SPEED); st.timers.push(id); return id; }
function every(fn, ms){ const id = setInterval(fn, ms * SPEED); st.timers.push(id); return id; }
function clearAll(){ st.timers.forEach(id => { clearTimeout(id); clearInterval(id); }); st.timers = []; }
window.__soc = st;   // read-only hook for automated tests

/* ---------- shared bits ---------- */
const langLink = () => `<a class="lang" href="${OTHER}" hreflang="${L==="ru"?"en":"ru"}" title="${t(S.langTitle)}">${t(S.langLabel)}</a>`;
const brand = () => `<div class="brand">${ic("shield",20)}${S.brand}</div>`;
const rColor = i => ["var(--warn)","var(--ai)","var(--rule)"][i];
const rSoft = i => ["var(--warn-s)","var(--ai-s)","var(--rule-s)"][i];
function show(html){ clearAll(); app.innerHTML = html; window.scrollTo(0,0); const f = app.querySelector("[data-autofocus]"); if(f) f.focus({preventScroll:true}); }

  show(`<section class="screen hero">

    <div class="eyebrow">${t(S.eyebrow)}</div>

function roundIntro(r){

  if(r === 2) return tools();
  const text = r === 0 ? S.r1Intro : S.r2Intro;
  show(`<section class="screen">
    <div class="topline">${brand()}<span class="rchip" style="color:${rColor(r)}">${t(S.round)} ${r+1}/3</span></div>
    <div class="eyebrow" style="color:${rColor(r)}">${t(S.round)} ${r+1}</div>

function tools(){
  const on = new Set();
  show(`<section class="screen">
    <div class="topline">${brand()}<span class="rchip" style="color:${rColor(2)}">${t(S.round)} 3/3</span></div>
    <div class="eyebrow" style="color:${rColor(2)}">${t(S.round)} 3</div>
    <h2 style="font-size:30px">${t(S.r[2].name)}</h2>
    <p class="lead">${t(S.r3Intro)}</p>
    <div class="tools">${TOOLS.map(x=>`<button class="tool" aria-pressed="false" data-k="${x.k}"><span class="ic">${ic(x.icon,22)}</span><span><b>${t(x.name)}</b><span>${t(x.d)}</span></span><span class="sw" aria-hidden="true"></span></button>`).join("")}</div>
    <div class="cta stick"><button class="btn go" id="go" disabled>${t(S.r3Run)} →</button></div>
  </section>`);
  app.querySelectorAll(".tool").forEach(b => b.onclick = () => {
    const k = b.dataset.k; on.has(k) ? on.delete(k) : on.add(k);
    b.setAttribute("aria-pressed", on.has(k));
    $("#go").disabled = on.size < 3;
    if(on.size === 3) $("#go").focus({preventScroll:true});
  });
  $("#go").onclick = () => play(2);
}

/* ---------- play ---------- */
const DECK = [R1, R2, R3];
function play(r){
  st.round = r; st.idx = 0; st.busy = false; st.t0 = performance.now(); st.tick = 0; st.counter = 0; st.feed = [];
  show(`<section class="play" aria-label="${t(S.r[r].name)}">
    <div class="hud"><span class="rchip" style="color:${rColor(r)}">${t(S.round)} ${r+1}/3 · ${t(S.r[r].name)}</span>
      <div class="stats"><span class="stat" style="color:var(--allow)">✓ <b id="sc">0</b></span><span class="stat" style="color:var(--block)">✕ <b id="sm">0</b></span></div></div>
    <div class="queue" id="queue"></div>
    ${r>0?`<div class="ticker" id="ticker" aria-hidden="true"></div>`:""}
    <div class="stage" id="stage" aria-live="polite"></div>
    <div class="timer ${st.calm?"calm":""}" id="timer"><i></i></div>
    <div class="decide" id="decide"></div>
  </section>`);
  if(r === 0) every(r1Queue, 250);
  else every(() => tickFeed(r), 900);
  r1Queue(); renderQueue();
  nextCard();
}
function r1Queue(){
  if(st.round !== 0) return;
  const sec = (performance.now() - st.t0) / 1000 / SPEED;
  const rate = Math.round(5 * Math.pow(1.11, sec));          // 5/min at start, hundreds per minute by the end
  st.counter = Math.max(st.counter, Math.round(rate * 0.6 + sec * 1.5));
  const q = $("#queue"); if(!q) return;
  q.innerHTML = `<span>${t(S.queue)}: <span class="mono">${fmt(st.counter)}</span></span><span class="rate mono">${fmt(rate)} ${t(S.rate)}</span>`;
}
function renderQueue(){
  if(st.round === 0) return;
  const q = $("#queue"); if(!q) return;
  q.innerHTML = `<span>${st.round===1?t(S.aiChecked):t(S.rulesChecked)}: <span class="mono">${fmt(st.counter)}</span></span><span class="mono" style="color:${rColor(st.round)}">${ic(st.round===1?"ai":"passport",14)}</span>`;
}
function tickFeed(r){
  st.tick++;
  st.counter += 40 + Math.floor(Math.random()*60);
  const sp = (r === 1 ? R2_SPECIAL : R3_SPECIAL)[st.tick];
  let item;
  if(sp){
    if(r === 1) item = sp.kind === "aiBlock"
      ? {x:t(sp.x), v:"✕ " + (L==="ru"?"ИИ: блок":"AI: blocked"), c:"var(--block)"}
      : {x:t(sp.x), v:"✓ " + (L==="ru"?"ИИ: безопасно 96%":"AI: safe 96%"), c:"var(--allow)"};
    else item = {x:t(sp.x), v:"✕ " + t(sp.v), c:"var(--block)", hl:!!sp.hl};
  } else {
    const base = FEED_OK[(st.tick * 5) % FEED_OK.length];
    item = {x:t(base), v:"✓ " + (r===1 ? (L==="ru"?"ИИ: ок":"AI: ok") : t(R3_OK_V[st.tick % 2])), c:"var(--allow)"};
  }
  const tk = $("#ticker");
  if(tk){
    const row = document.createElement("div");
    row.className = "tk" + (item.hl ? " hl" : "");
    row.innerHTML = `<span class="d" style="background:${item.c}"></span><span class="x">${esc(item.x)}</span><span class="v" style="color:${item.c}">${esc(item.v)}</span>`;
    const pin = tk.querySelector(".tk.hl");               // the highlighted row stays on top for the rest of the round
    if(pin && !item.hl) pin.after(row); else tk.prepend(row);
    [...tk.querySelectorAll(".tk:not(.hl)")].slice(pin || item.hl ? 3 : 4).forEach(x => x.remove());
  }
  renderQueue();
}
function facts(c){
  let h = `<div class="facts"><div class="fact">${ic("read",18)}<span><b style="color:var(--ink);font-weight:500">${t(S.before)}:</b> ${t(c.before)}</span></div>
    <div class="fact">${ic("target",18)}<span><b style="color:var(--ink);font-weight:500">${t(S.where)}:</b> ${t(c.where)}</span></div>`;
  if(c.alert) h += `<div class="fact alert">${ic("alert",18)}<span>${t(c.alert)}</span></div>`;
  return h + `</div>`;
}
function cardHTML(c, r){
  const ag = AG[c.a];
  let extra = "";
  if(r === 1) extra = `<div class="verdict ai">${ic("ai",18)} ${t(S.aiSays)}: ${t(c.ai.l)} · ${c.ai.p}%</div>`;
  if(r === 2) extra = `<div class="verdict human">${ic("human",18)} ${t(S.humanNeeded)}. ${t(c.need)}</div>
    <div class="checks">${c.checks.map(([k,v]) => `<span class="chk ${v===1?"ok":v===0?"no":"na"}">${v===1?"✓":v===0?"✕":"–"} ${t(CHECK[k])}: ${t(CHECK_STATE[v])}</span>`).join("")}</div>`;
  return `<article class="card" id="card">
    <span class="hint l">${t(S.block).toUpperCase()}</span><span class="hint r">${t(S.allow).toUpperCase()}</span>
    <div class="agent"><span class="av">${ic(ag.icon,24)}</span><div><b>${t(ag.role)}</b><span class="mono">${ag.id}</span></div></div>
    <div class="act">${t(c.act)}</div>
    ${facts(c)}
    ${extra}
  </article>`;
}
function setButtons(mode){
  const d = $("#decide"); if(!d) return;
  if(mode === "decide") d.innerHTML = `<button class="btn b-block" id="bb">✕ ${t(S.block)}</button><button class="btn b-allow" id="ba">✓ ${t(S.allow)}</button>`;
  else if(mode === "next") d.innerHTML = `<button class="btn b-next" id="bn">${t(S.next)} →</button>`;
  else d.innerHTML = `<button class="btn b-block" disabled>✕ ${t(S.block)}</button><button class="btn b-allow" disabled>✓ ${t(S.allow)}</button>`;
  const bb = $("#bb"), ba = $("#ba"), bn = $("#bn");
  if(bb) bb.onclick = () => decide("block");
  if(ba) ba.onclick = () => decide("allow");
  if(bn){ bn.onclick = advance; bn.focus({preventScroll:true}); }
}
function cardTime(r, i){ return r === 0 ? R1_TIME[i] : r === 1 ? 9000 : 15000; }
function nextCard(){
  const r = st.round, deck = DECK[r];
  if(st.idx >= deck.length) return endRound();
  const c = deck[st.idx];
  $("#stage").innerHTML = cardHTML(c, r);
  attachSwipe($("#card"));
  setButtons("decide");
  st.busy = false;
  const bar = $("#timer i");
  bar.style.transition = "none"; bar.style.width = "100%";
  void bar.offsetWidth;
  if(!st.calm){
    const ms = cardTime(r, st.idx) * SPEED;
    bar.style.transition = `width ${ms}ms linear`; bar.style.width = "0%";
    st.cardTimer = later(() => decide("timeout"), cardTime(r, st.idx));
  }
}
function decide(choice){
  if(st.busy) return; st.busy = true;
  if(st.cardTimer){ clearTimeout(st.cardTimer); st.cardTimer = null; }
  const r = st.round, c = DECK[r][st.idx], res = st.res[r];
  const late = choice === "timeout";
  const eff = late ? (r === 2 ? "block" : "allow") : choice;   // round 3 fails closed
  let cls, head;
  if(c.bad && eff === "block"){ res.caught++; cls = "good"; head = late ? S.fLateClosedBad : S.fGoodBlock; }
  else if(c.bad){ res.missed++; cls = "bad"; head = late ? S.fLateBad : S.fBadAllow; }
  else if(eff === "allow"){ res.ok++; cls = late ? "warn" : "good"; head = late ? S.fLateOk : S.fGoodAllow; }
  else { res.fp++; cls = "warn"; head = late ? S.fLateClosedOk : S.fBadBlock; }
  if(late) res.late++;
  if(r === 2 && c.bad) st.acme = late ? "late" : eff === "block" ? "caught" : "missed";
  $("#sc").textContent = res.caught; $("#sm").textContent = res.missed;
  const bar = $("#timer i"); const w = getComputedStyle(bar).width; bar.style.transition = "none"; bar.style.width = w;
  const card = $("#card");
  if(card){ card.style.transform = ""; card.classList.add(eff === "block" ? "fly-l" : "fly-r"); }
  const mark = cls === "good" ? "✓" : cls === "bad" ? "✕" : "!";
  later(() => {
    const stage = $("#stage"); if(!stage) return;
    stage.innerHTML = `<div class="fb ${cls}" role="status"><b>${mark} ${t(head)}</b><p>${t(c.why)}</p></div>`;
  }, 260);
  if(r === 2 || st.calm){ later(() => setButtons("next"), 300); setButtons("off"); }
  else { setButtons("off"); later(advance, r === 0 ? 1700 : 2700); }
}
function advance(){ st.idx++; nextCard(); }
function attachSwipe(el){
  if(!el) return;
  let x0 = null, y0 = 0, dx = 0, id = null;
  const hl = el.querySelector(".hint.l"), hr = el.querySelector(".hint.r");
  el.addEventListener("pointerdown", e => { if(st.busy) return; x0 = e.clientX; y0 = e.clientY; dx = 0; id = e.pointerId; el.style.transition = "none"; });
  el.addEventListener("pointermove", e => {
    if(x0 === null || e.pointerId !== id) return;
    dx = e.clientX - x0;
    if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - y0)){ try{ el.setPointerCapture(id); }catch(_){} }
    el.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
    hl.style.opacity = Math.min(1, Math.max(0, -dx/90)); hr.style.opacity = Math.min(1, Math.max(0, dx/90));
  });
  const up = () => {
    if(x0 === null) return; x0 = null;
    if(Math.abs(dx) > 90){ decide(dx < 0 ? "block" : "allow"); return; }
    el.style.transition = "transform .2s"; el.style.transform = ""; hl.style.opacity = 0; hr.style.opacity = 0;
  };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
}
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("textarea,input")) return;
  if(!$("#card") || st.busy) return;
  if(e.key === "ArrowLeft"){ e.preventDefault(); decide("block"); }
  if(e.key === "ArrowRight"){ e.preventDefault(); decide("allow"); }
});

/* ---------- round end ---------- */
function endRound(){
  const r = st.round, res = st.res[r];
  const secs = (performance.now() - st.t0) / 1000 / SPEED;
  clearAll();
  if(r === 1){ res.caught += 2; res.missed += 1; res.auto = 2; }    // the AI's own decisions in the feed
  if(r === 2){ res.caught += 4; res.auto = 4; }                     // the rules' own decisions in the feed
  const nums = `<div class="nums">
    <div class="num"><b style="color:var(--allow)">${res.caught}<small style="font-size:14px;color:var(--muted)"> / 5</small></b><span>${t(S.dangerStopped)}</span></div>
    <div class="num"><b style="color:var(--block)">${res.missed}</b><span>${t(S.nMissed)}</span></div>
    <div class="num"><b style="color:var(--warn)">${res.fp}</b><span>${t(S.nFalse)}</span></div>
    <div class="num"><b>${r===0?res.late:res.auto}</b><span>${r===0?t(S.nLate):t(S.nAuto)}</span></div></div>`;
  let pre = "", body = "", next = "";
  if(r === 0){
    const perfect = res.missed + res.fp + res.late === 0;
    st.vol = Math.round(Math.max(secs, 20) * 140);
    body = `<p class="lead">${fill(t(S.r1Volume), {n: fmt(st.vol)})}</p><p class="lesson">${t(perfect ? S.r1Perfect : S.r1Lesson)}</p>`;
    next = S.r1Next;
  } else if(r === 1){
    pre = `<div class="reveal"><b>${t(S.r2RevealT)}</b><div class="q">${t(S.r2RevealQ)}</div><div class="verdict ai">${ic("ai",18)} ${t(S.r2RevealV)}</div><p style="margin:0" class="small">${t(S.r2RevealWhy)}</p></div>`;
    body = `<p class="muted">${t(S.r2Auto)}</p><p class="lesson">${t(S.r2Lesson)}</p>`;
    next = S.r2Next;
  } else {
    const acme = {caught:S.r3AcmeCaught, late:S.r3AcmeLate, missed:S.r3AcmeMissed}[st.acme] || S.r3AcmeMissed;
    body = `<p class="muted">${t(S.r3Auto)} ${t(S.r3Fewer)}</p><p class="lesson">${t(acme)}</p>`;
    next = S.r3Next;
  }
  show(`<section class="screen">
    <div class="topline">${brand()}<span class="rchip" style="color:${rColor(r)}">${t(S.round)} ${r+1}/3</span></div>
    <div class="eyebrow" style="color:${rColor(r)}">${t(S.resTitle)} · ${t(S.r[r].name)}</div>
    ${pre}${nums}${body}
    <div class="cta stick"><button class="btn go" id="go" data-autofocus>${t(next)} →</button></div>
  </section>`);
  $("#go").onclick = () => r < 2 ? roundIntro(r + 1) : final();
}

/* ---------- final ---------- */
function final(){
  const [a,b,c] = st.res.map(x => x.caught), n = a + b + c;
  const share = fill(t(S.shareText), {n, a, b, c, url: PAGE});
  const MK = [
    {icon:"passport", n:{ru:"Паспорт и права агента", en:"Agent passport and permissions"}, p:{ru:"Кто агент, кто его создал, от чьего имени он действует и что ему можно.", en:"Who the agent is, who made it, who it acts for and what it may do."}, w:{ru:"Уже там: Microsoft Entra Agent ID, открытый протокол AAuth в IETF.", en:"Already there: Microsoft Entra Agent ID and the open AAuth protocol at the IETF."}},
    {icon:"two", n:{ru:"Контроль полномочий в реальном времени", en:"Real-time control of permissions"}, p:{ru:"Что агенту можно прямо сейчас, с учётом того, что он уже прочитал.", en:"What the agent may do right now, given what it has already read."}, w:{ru:"Идеи: «смертельная триада» Саймона Уиллисона, Agents Rule of Two (Meta), CaMeL (Google DeepMind).", en:"Ideas: Simon Willison’s “lethal trifecta”, Meta’s Agents Rule of Two, Google DeepMind’s CaMeL."}},
    {icon:"peer", n:{ru:"Доверие между компаниями", en:"Trust between companies"}, p:{ru:"Сервис другой компании проверяет агента и намерение пользователя сам.", en:"The other company’s service checks the agent and the user’s intent itself."}, w:{ru:"Первые шаги: Visa Trusted Agent Protocol, Mastercard Agent Pay. Для всего, что не платежи, — пока пусто.", en:"First steps: Visa Trusted Agent Protocol and Mastercard Agent Pay. Beyond payments, the space is still empty."}},
  ];
  const bar = (i, v) => `<div class="bar"><div class="top"><span>${i+1}. ${t(S.r[i].name)}</span><b>${v}/5</b></div><div class="tr"><i style="width:0;background:${rColor(i)}" data-w="${v*20}%"></i></div><div class="sub">${fill(t(S.cover[i]), {v: fmt(st.vol || 0)})} · ${fill(t(S.barSub), {n: st.res[i].fp})}</div></div>`;
  show(`<section class="screen">
    <div class="topline">${brand()}${langLink()}</div>
    <div class="eyebrow">${t(S.finalEyebrow)}</div>
    <div><div class="big">${n}<small> / 15</small></div><p class="muted" style="margin:6px 0 0">${t(S.finalOf)}</p><p class="note" style="margin:6px 0 0">${t(S.finalMax)}</p></div>
    <div class="bars">${bar(0,a)}${bar(1,b)}${bar(2,c)}</div>
    <p class="thesis">${t(S.thesis)}</p>
    <div class="sec share"><h3>${t(S.shareT)}</h3>
      <textarea id="sharetext" aria-label="${t(S.shareT)}">${esc(share)}</textarea>
      <div class="row"><button class="btn" id="copy">${t(S.copy)}</button><a class="btn" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(PAGE)}" target="_blank" rel="noopener">${t(S.linkedin)}</a></div>
      <p class="note" id="copynote" role="status"></p></div>
    <div class="sec"><h3>${t(S.marketsT)}</h3><div class="markets">${MK.map(m => `<div class="mk"><div class="h"><span class="ic">${ic(m.icon,18)}</span><b>${t(m.n)}</b></div><p>${t(m.p)}</p><span class="who">${t(m.w)}</span></div>`).join("")}</div></div>
    <a class="btn ghost" href="https://nibrmi.github.io/aauth/${L}/" target="_blank" rel="noopener">${t(S.aauth)}</a>
    <div class="sec"><h3>${t(S.casesT)}</h3><ul class="links">
      <li><a href="https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html" target="_blank" rel="noopener">EchoLeak — Microsoft 365 Copilot (2025)</a></li>
      <li><a href="https://curity.io/blog/5-agentic-ai-security-incidents-and-vulnerabilities/" target="_blank" rel="noopener">GitHub MCP prompt injection (2025)</a></li>
      <li><a href="https://incidentdatabase.ai/reports/5593/" target="_blank" rel="noopener">Replit agent deleted a production database (2025)</a></li></ul></div>
    <div class="sec"><h3>${t(S.sourcesT)}</h3><ul class="links">
      <li><a href="https://arxiv.org/abs/2510.09023" target="_blank" rel="noopener">The Attacker Moves Second (arXiv, 2025)</a></li>
      <li><a href="https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/" target="_blank" rel="noopener">Simon Willison — The lethal trifecta</a></li>
      <li><a href="https://ai.meta.com/blog/practical-ai-agent-security/" target="_blank" rel="noopener">Meta — Agents Rule of Two</a></li>
      <li><a href="https://www.malwarebytes.com/blog/news/2025/12/prompt-injection-is-a-problem-that-may-never-be-fixed-warns-ncsc" target="_blank" rel="noopener">NCSC: prompt injection may never be fixed</a></li>
      <li><a href="https://www.gartner.com/en/newsroom/press-releases/2025-06-11-gartner-predicts-that-guardian-agents-will-capture-10-15-percent-of-the-agentic-ai-market-by-2030" target="_blank" rel="noopener">Gartner — guardian agents</a></li></ul></div>
    <div class="cta"><button class="btn go" id="again">${t(S.replay)}</button><p class="note">${t(S.disclaimer)}</p></div>
  </section>`);
  requestAnimationFrame(() => requestAnimationFrame(() => app.querySelectorAll(".tr i").forEach(i => i.style.width = i.dataset.w)));
  $("#copy").onclick = () => {
    const ta = $("#sharetext"), note = $("#copynote");
    const done = ok => { note.textContent = ok ? t(S.copied) : t(S.copyFail); if(!ok){ ta.focus(); ta.select(); } };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => done(true), () => done(false));
    else done(false);
  };
  $("#again").onclick = intro;
}

intro();
})();
</script>
</body>
</html>
